name: Build Native Binaries

on:
  workflow_dispatch: # 仅允许手动触发

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 允许单平台失败不影响其他平台
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: whatdidisay.dll     # ⚠️ 请确保与 Cargo.toml 中的 name 字段一致
            name: Windows-x86_64
            
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: libwhatdidisay.so   # ⚠️ 请确保与 Cargo.toml 中的 name 字段一致
            name: Linux-x86_64
            
          - os: macos-13             # Intel Mac
            target: x86_64-apple-darwin
            bin: libwhatdidisay.dylib
            name: macOS-Intel
            
          - os: macos-latest         # Apple Silicon (M1/M2/M3)
            target: aarch64-apple-darwin
            bin: libwhatdidisay.dylib
            name: macOS-ARM64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 【关键】安装 Linux 下 sherpa-onnx 链接所需的 C++ 和 CMake 依赖
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libssl-dev

      # 安装 macOS 下的 cmake
      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      # 仅上传编译出的单一二进制文件
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatdidisay-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          retention-days: 30
