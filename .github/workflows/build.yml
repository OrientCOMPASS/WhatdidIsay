name: Build Native Binaries

on:
  workflow_dispatch: # 仅允许手动触发

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x86_64
            
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: Linux-x86_64
            
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macOS-ARM64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libssl-dev

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Debug Build Output
        shell: bash
        run: |
          echo "Listing release directory..."
          ls -la target/${{ matrix.target }}/release/ || dir target\${{ matrix.target }}\release\

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v5
        with:
          name: whatdidisay-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/*.dll
            target/${{ matrix.target }}/release/*.so
            target/${{ matrix.target }}/release/*.dylib
          retention-days: 30
